<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b5cad">
  <title>SiteOps Field Report</title>
  <style>/* SiteOps Twin MVP — shared styles (dashboard + field app). SYNTHETIC DEMO. */
:root {
  --bg: #f6f7f9; --surface: #ffffff; --text: #1b1f24; --muted: #4a5360; --border: #d3d8de;
  --accent: #0b5cad; --accent-text: #ffffff; --focus: #ffbf47;
  --status-ok: #009E73; --status-tol: #56B4E9; --status-bad: #D55E00; --status-unk: #7F7F7F; --status-ovr: #CC79A7;
  --sev-high: #b3261e; --sev-med: #8a5a00; --sev-low: #3a4a5a;
  --synthetic: #6b2fa3;
  --radius: 6px; --gap: 12px;
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12161b; --surface: #1b2128; --text: #eef1f4; --muted: #b6bfca; --border: #3a434d;
    --accent: #6cb4ff; --accent-text: #0b1520; --sev-high: #ff8a80; --sev-med: #ffcc66; --sev-low: #b6c6d6; --synthetic: #d0a6ff;
  }
}
:root[data-theme="dark"] {
  --bg: #12161b; --surface: #1b2128; --text: #eef1f4; --muted: #b6bfca; --border: #3a434d;
  --accent: #6cb4ff; --accent-text: #0b1520; --sev-high: #ff8a80; --sev-med: #ffcc66; --sev-low: #b6c6d6; --synthetic: #d0a6ff;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--text); font-size: 15px; line-height: 1.4; }
a { color: var(--accent); }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
button, select, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: 1px solid var(--border); background: var(--surface); border-radius: var(--radius); padding: 6px 12px; min-height: 36px; }
button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
button:disabled { opacity: .5; cursor: not-allowed; }
select, input, textarea { border: 1px solid var(--border); background: var(--surface); border-radius: var(--radius); padding: 6px 8px; min-height: 36px; }
label { display: inline-flex; flex-direction: column; gap: 2px; font-size: 13px; color: var(--muted); }

/* Top bar */
.topbar { display: flex; flex-wrap: wrap; gap: var(--gap); align-items: center; padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 1000; }
.topbar h1 { font-size: 18px; margin: 0 8px 0 0; }
.badge-synthetic { background: var(--synthetic); color: #fff; font-weight: 700; font-size: 12px; padding: 3px 8px; border-radius: 4px; letter-spacing: .04em; }
.topbar .controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-end; margin-left: auto; }
nav.tabs { display: flex; flex-wrap: wrap; gap: 4px; padding: 8px 16px; background: var(--surface); border-bottom: 1px solid var(--border); }
nav.tabs a { text-decoration: none; padding: 8px 12px; border-radius: var(--radius); color: var(--text); }
nav.tabs a[aria-current="page"] { background: var(--accent); color: var(--accent-text); }
main { padding: 16px; max-width: 1500px; margin: 0 auto; }
h2 { font-size: 18px; margin: 4px 0 12px; }
h3 { font-size: 15px; margin: 16px 0 8px; }

/* Cards / KPI tiles */
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: var(--gap); margin-bottom: 16px; }
.tile { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 10px 12px; }
.tile .label { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .03em; }
.tile .value { font-size: 22px; font-weight: 700; margin-top: 2px; }
.tile .sub { font-size: 12px; color: var(--muted); }
.panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px; margin-bottom: 16px; }
.grid2 { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: var(--gap); }
@media (max-width: 900px) { .grid2 { grid-template-columns: 1fr; } }

/* Status chips: colour + icon + text (never colour alone) */
.status { display: inline-flex; align-items: center; gap: 4px; font-weight: 600; font-size: 12px; padding: 2px 6px; border-radius: 4px; border: 2px solid currentColor; white-space: nowrap; }
.status.MATCHED { color: var(--status-ok); }
.status.WITHIN_TOLERANCE { color: #1f7fb8; }
.status.DISCREPANCY { color: var(--status-bad); }
.status.UNVERIFIABLE { color: var(--status-unk); border-style: dashed; }
.status.OK { color: var(--status-ok); }
.status.OVERCLAIM { color: var(--status-bad); }
.status.NO_SIGNAL, .status.NO_DATA { color: var(--status-unk); border-style: dashed; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .status.WITHIN_TOLERANCE { color: var(--status-tol); } }
.sev { font-weight: 700; font-size: 12px; white-space: nowrap; }
.sev.HIGH { color: var(--sev-high); } .sev.MED { color: var(--sev-med); } .sev.LOW { color: var(--sev-low); }

/* KP strip */
.kpstrip { display: grid; grid-template-columns: repeat(25, minmax(36px, 1fr)); gap: 2px; overflow-x: auto; padding-bottom: 4px; }
.kpcell { border: 1px solid var(--border); border-radius: 4px; padding: 4px 2px; text-align: center; cursor: pointer; background: var(--surface); min-width: 36px; }
.kpcell:hover { border-color: var(--accent); }
.kpcell .bar { height: 6px; border-radius: 3px; margin: 2px 0; }
.kpcell .bar.MATCHED { background: var(--status-ok); }
.kpcell .bar.WITHIN_TOLERANCE { background: var(--status-tol); }
.kpcell .bar.DISCREPANCY { background: var(--status-bad); }
.kpcell .bar.UNVERIFIABLE { background: repeating-linear-gradient(45deg, var(--status-unk) 0 3px, transparent 3px 6px); }
.kpcell .icon { font-size: 14px; font-weight: 700; }
.kpcell .sid { font-size: 11px; color: var(--muted); }
.mini { display: flex; flex-direction: column; gap: 1px; margin-top: 3px; }
.mini span { display: block; height: 3px; background: var(--border); position: relative; }
.mini span i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--accent); }
.kplabels { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); margin-top: 4px; }
.legend { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0; font-size: 12px; }
#map { height: 340px; border-radius: var(--radius); border: 1px solid var(--border); }

/* Tables */
.tablewrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; background: var(--surface); font-size: 13px; }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--border); vertical-align: top; }
th { position: sticky; top: 0; background: var(--surface); font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .02em; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
tr.flag td { background: color-mix(in srgb, var(--status-bad) 10%, transparent); }
.neg { color: var(--status-bad); font-weight: 700; }
.filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-end; margin-bottom: 10px; }
.muted { color: var(--muted); }
.note { font-size: 13px; color: var(--muted); border-left: 3px solid var(--synthetic); padding-left: 8px; margin: 8px 0; }

/* States */
.state { padding: 24px; text-align: center; color: var(--muted); }
.state.error { color: var(--status-bad); border: 1px solid var(--status-bad); border-radius: var(--radius); }

/* Dialog */
dialog { border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); color: var(--text); max-width: 460px; width: 92vw; }
dialog::backdrop { background: rgba(0,0,0,.45); }
dialog form { display: flex; flex-direction: column; gap: 10px; }
dialog .actions { display: flex; gap: 8px; justify-content: flex-end; }
.msg { font-size: 13px; }
.msg.err { color: var(--status-bad); font-weight: 600; }

/* ---------- Field app (mobile) ---------- */
body.field { font-size: 17px; }
.field header { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 10; }
.field header h1 { font-size: 18px; margin: 0; }
.field main { padding: 12px 16px 96px; max-width: 560px; }
.field .net { font-size: 13px; font-weight: 700; padding: 4px 8px; border-radius: 4px; border: 2px solid currentColor; }
.field .net.online { color: var(--status-ok); } .field .net.offline { color: var(--status-bad); }
.field .steps { display: flex; gap: 4px; margin: 8px 0 12px; }
.field .steps span { flex: 1; text-align: center; padding: 6px 0; border-bottom: 4px solid var(--border); font-size: 14px; }
.field .steps span.on { border-color: var(--accent); font-weight: 700; }
.field label { font-size: 15px; color: var(--text); width: 100%; margin-bottom: 10px; }
.field input, .field select, .field textarea, .field button { min-height: 48px; font-size: 17px; width: 100%; }
.field .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.field fieldset { border: 1px solid var(--border); border-radius: var(--radius); padding: 10px; margin: 0 0 12px; }
.field legend { font-weight: 700; padding: 0 4px; }
.field .navbtns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
.field .bottomnav { position: fixed; bottom: 0; left: 0; right: 0; display: grid; grid-template-columns: repeat(3, 1fr); background: var(--surface); border-top: 1px solid var(--border); }
.field .bottomnav button { border: 0; border-radius: 0; min-height: 56px; }
.field .bottomnav button[aria-current="page"] { background: var(--accent); color: var(--accent-text); font-weight: 700; }
.field .qitem { border: 1px solid var(--border); border-radius: var(--radius); padding: 10px; margin-bottom: 8px; background: var(--surface); }
.field .qitem img { max-width: 72px; max-height: 72px; border-radius: 4px; margin: 4px 4px 0 0; }
.field .qstate { font-weight: 700; font-size: 14px; }
.field .qstate.pending { color: var(--sev-med); } .field .qstate.synced { color: var(--status-ok); }
.field .qstate.duplicate { color: #1f7fb8; } .field .qstate.error { color: var(--status-bad); }
.field .err { color: var(--status-bad); font-weight: 600; font-size: 15px; }
.field .stepper { display: grid; grid-template-columns: 64px 1fr 64px; gap: 8px; align-items: center; }
.field .stepper output { text-align: center; font-size: 28px; font-weight: 700; }

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}@media (max-width:800px){.grid2{grid-template-columns:1fr}}
@media print{header,nav.tabs,#printDR,.banner{display:none!important}.panel{break-inside:avoid;box-shadow:none}}
</style>
</head>
<body class="field">
  <header>
    <h1>Field report <span class="badge-synthetic">SYNTHETIC DEMO</span></h1>
    <span id="net" class="net" role="status" aria-live="polite"></span>
  </header>
  <main>
    <!-- M1 Daily report: 3 steps -->
    <section id="pageReport" aria-labelledby="hReport">
      <h2 id="hReport" class="sr">Daily report</h2>
      <div class="steps" aria-hidden="true"><span data-s="1">1 Crew</span><span data-s="2">2 Work</span><span data-s="3">3 Evidence</span></div>
      <form id="reportForm" novalidate>
        <div class="step" data-step="1">
          <label>Date <input type="date" id="rDate" required></label>
          <label>Crew <select id="rCrew" required></select></label>
          <label>Work front <select id="rFront" required></select></label>
          <!-- M4 crew muster: headcount only, no names -->
          <fieldset>
            <legend>Crew muster (headcount only)</legend>
            <div class="stepper">
              <button type="button" id="hcMinus" aria-label="Decrease headcount">−</button>
              <output id="hcOut" aria-live="polite">0</output>
              <button type="button" id="hcPlus" aria-label="Increase headcount">+</button>
            </div>
            <p class="muted" style="font-size:14px">Count the people present at the muster point. No names are recorded.</p>
          </fieldset>
          <button type="button" id="copyYesterday">Copy yesterday's report</button>
        </div>
        <div class="step" data-step="2" hidden>
          <div id="lines"></div>
          <button type="button" id="addLine">+ Add activity line</button>
        </div>
        <div class="step" data-step="3" hidden>
          <!-- M3 photo evidence -->
          <fieldset>
            <legend>Photo evidence</legend>
            <label>KP of photo (m) <input type="number" inputmode="numeric" id="photoKp" min="0"></label>
            <label>Take or choose photo <input type="file" id="photoIn" accept="image/*" capture="environment" multiple></label>
            <div id="photoList"></div>
            <p class="muted" style="font-size:14px">Only the name, time and KP are sent in the MVP. The thumbnail stays on this device.</p>
          </fieldset>
          <div id="summary" class="qitem"></div>
        </div>
        <div id="formErr" class="err" role="alert"></div>
        <div class="navbtns">
          <button type="button" id="prevBtn">Back</button>
          <button type="button" id="nextBtn" class="primary">Next</button>
        </div>
      </form>
    </section>

    <!-- M2 Offline queue -->
    <section id="pageQueue" hidden aria-labelledby="hQueue">
      <h2 id="hQueue">Outbox</h2>
      <button type="button" id="syncBtn" class="primary">Sync now</button>
      <p id="syncMsg" class="muted" role="status"></p>
      <div id="queue"></div>
    </section>
  </main>
  <nav class="bottomnav" aria-label="Field app">
    <button type="button" data-page="pageReport" aria-current="page">Report</button>
    <button type="button" data-page="pageQueue">Outbox <span id="qCount"></span></button>
    <button type="button" onclick="location.href='SiteOps_Twin_Dashboard.html'">Dashboard</button>
  </nav>
  <template id="lineTpl">
    <fieldset class="line">
      <legend>Activity line</legend>
      <label>Activity <select class="lAct" required></select></label>
      <div class="row2">
        <label>KP from (m) <input type="number" inputmode="numeric" class="lFrom" min="0" required></label>
        <label>KP to (m) <input type="number" inputmode="numeric" class="lTo" min="0" required></label>
      </div>
      <div class="row2">
        <label>Quantity <input type="number" inputmode="decimal" step="any" class="lQty" min="0" required></label>
        <label>Unit <input type="text" class="lUnit" readonly></label>
      </div>
      <div class="row2">
        <label>Hours worked <input type="number" inputmode="decimal" step="0.5" class="lHours" min="0" max="24" required></label>
        <label>Headcount <input type="number" inputmode="numeric" class="lHead" min="0"></label>
      </div>
      <label>Equipment used <select class="lEq" multiple size="4"></select></label>
      <div class="row2">
        <label>Downtime (h) <input type="number" inputmode="decimal" step="0.5" class="lDown" min="0" max="24" value="0"></label>
        <label>Reason
          <select class="lReason">
            <option value="">None</option><option>WEATHER</option><option>ACCESS</option><option>MATERIAL</option>
            <option>BREAKDOWN</option><option>PERMIT</option><option>OTHER</option>
          </select>
        </label>
      </div>
      <button type="button" class="lRemove">Remove line</button>
    </fieldset>
  </template>

<script>
// ---- SiteOps Twin stand-alone shim: replaces the backend with embedded SYNTHETIC snapshots ----
window.__SITEOPS_READY__ = (async () => {
  const b64 = document.getElementById('siteops-data').textContent.trim();
  const bytes = Uint8Array.from(atob(b64), (ch) => ch.charCodeAt(0));
  const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
  const D = JSON.parse(await new Response(stream).text());
  const audit = D.audit.slice();
  const certOverride = {};   // key -> qty (in-memory certifications)
  const alertState = {};     // alert_id -> {status, comment}
  const reports = [];
  const nowIso = () => new Date().toISOString().replace(/\.\d+Z$/, 'Z');
  const snapFor = (date) => {
    const ds = D.dates; let pick = ds[ds.length - 1];
    if (date) { pick = ds[0]; for (const d of ds) if (d <= date) pick = d; }
    return [pick, D.by_date[pick]];
  };
  const json = (body, status = 200) => new Response(JSON.stringify(body), { status, headers: { 'Content-Type': 'application/json' } });
  const scope = (arr, role, sc) => role === 'SC' ? arr.filter((x) => x.subcontractor_id === sc) : arr;
  const withState = (rows) => rows.map((r) => certOverride[r.key] != null ? { ...r, certified: certOverride[r.key] } : r);
  const alertsWithState = (al) => al.map((a) => alertState[a.alert_id] ? { ...a, ...alertState[a.alert_id] } : a);
  const addAudit = (role, entity, entity_id, action, detail) => audit.unshift({ event_id: audit.length + 1, ts: nowIso(), actor_role: role, entity, entity_id, action, detail, before_hash: null, after_hash: 'demo' });

  const realFetch = window.fetch.bind(window);
  window.fetch = async (input, init = {}) => {
    const url = new URL(typeof input === 'string' ? input : input.url, 'http://demo.local');
    if (!url.pathname.startsWith('/api/')) return realFetch(input, init);
    const h = new Headers(init.headers || {});
    const role = (h.get('X-Role') || 'CM').toUpperCase(); const sc = h.get('X-Subcontractor');
    if (role === 'SC' && !sc) return json({ detail: 'X-Subcontractor header required for role SC' }, 400);
    const method = (init.method || 'GET').toUpperCase();
    const q = Object.fromEntries(url.searchParams.entries());
    const [date, S] = snapFor(q.date);
    const p = url.pathname;
    if (method === 'GET') {
      if (p === '/api/meta') return json({ ...D.meta, date_min: D.dates[0], date_max: D.dates[D.dates.length - 1], standalone: true, snapshot_dates: D.dates });
      if (p === '/api/geometry') return json(D.geometry);
      if (p === '/api/health') return json({ ok: true, synthetic: true, standalone: true });
      if (p === '/api/overview') {
        if (role !== 'SC') return json(S.overview);
        const rows = scope(S.reconciliation, role, sc);
        const ov = JSON.parse(JSON.stringify(S.overview));
        const cv = rows.reduce((t, r) => t + r.claimed * r.rate, 0), ce = rows.reduce((t, r) => t + r.certifiable * r.rate, 0);
        ov.kpis.claimed_value = +cv.toFixed(2); ov.kpis.certifiable_value = +ce.toFixed(2); ov.kpis.at_risk_value = +(cv - ce).toFixed(2);
        const bs = { MATCHED: 0, WITHIN_TOLERANCE: 0, DISCREPANCY: 0, UNVERIFIABLE: 0 }; rows.forEach((r) => { if (r.claimed > 0) bs[r.status]++; });
        ov.kpis.rows_by_status = bs; return json(ov);
      }
      if (p === '/api/reconciliation') {
        let rows = withState(scope(S.reconciliation, role, sc));
        for (const [k, f] of [['subcontractor', 'subcontractor_id'], ['status', 'status'], ['activity', 'activity_code'], ['section', 'section_id']]) if (q[k]) rows = rows.filter((r) => r[f] === q[k]);
        return json({ rows });
      }
      if (p === '/api/production') return json({ ...S.production, rows: scope(S.production.rows, role, sc) });
      if (p === '/api/alerts') {
        let al = alertsWithState(scope(S.alerts, role, sc));
        for (const [k, f] of [['status', 'status'], ['rule', 'rule_id'], ['severity', 'severity'], ['subcontractor', 'subcontractor_id']]) if (q[k]) al = al.filter((a) => a[f] === q[k]);
        return json({ alerts: al });
      }
      if (p === '/api/scorecard') return json({ ...S.scorecard, rows: scope(S.scorecard.rows, role, sc) });
      if (p === '/api/presence') return json({ ...S.presence, fronts: scope(S.presence.fronts, role, sc), equipment: scope(S.presence.equipment, role, sc) });
      if (p === '/api/audit') return role === 'SC' ? json({ detail: 'audit log not available to subcontractors' }, 403) : json({ events: audit.filter((e) => (!q.entity || e.entity === q.entity) && (!q.entity_id || e.entity_id === q.entity_id)) });
      if (p === '/api/field-reports') return json({ reports });
      if (p === '/api/daily-report') return role === 'SC' ? json({ detail: 'the client daily report is an internal/client document' }, 403) : json(S.daily_report);
      let m = p.match(/^\/api\/sections\/([^/]+)$/);
      if (m) {
        const sid = decodeURIComponent(m[1]); const x = S.sections[sid];
        if (!x) return json({ detail: 'unknown section' }, 404);
        return json({ ...x, rows: withState(scope(S.reconciliation.filter((r) => r.section_id === sid), role, sc)), alerts: alertsWithState(scope(S.alerts.filter((a) => a.section_id === sid), role, sc)), audit: audit.filter((e) => (e.detail || '').includes(sid)) });
      }
      m = p.match(/^\/api\/certificate\/([^/]+?)(\.csv)?$/);
      if (m) {
        const sub = decodeURIComponent(m[1]);
        if (role === 'SC' && sub !== sc) return json({ detail: 'subcontractors can only see their own certificate' }, 403);
        const c = JSON.parse(JSON.stringify(S.certificate[sub] || { lines: [] }));
        c.lines.forEach((l) => { if (certOverride[l.key] != null) { l.cum_certified = certOverride[l.key]; l.this_period = +(l.cum_certified - l.prev_certified).toFixed(1); l.amount = +(l.this_period * l.rate).toFixed(2); } });
        c.total_this_period = +c.lines.reduce((t, l) => t + l.amount, 0).toFixed(2);
        if (!m[2]) return json(c);
        const cols = ['key', 'boq_item_id', 'activity_code', 'section_id', 'unit', 'cum_certified', 'prev_certified', 'this_period', 'rate', 'amount'];
        const csv = `# SYNTHETIC certificate draft ${sub} period_to ${date}\n` + cols.join(',') + '\n' + c.lines.map((l) => cols.map((k) => l[k]).join(',')).join('\n') + '\n';
        return new Response(csv, { status: 200, headers: { 'Content-Type': 'text/csv' } });
      }
      return json({ detail: 'not available in the stand-alone demo' }, 404);
    }
    const body = init.body ? JSON.parse(init.body) : {};
    if (p === '/api/certify') {
      if (!['QS', 'CM'].includes(role)) return json({ detail: 'only QS or CM may certify' }, 403);
      const row = S.reconciliation.find((r) => r.key === body.key);
      if (!row) return json({ detail: 'unknown reconciliation key' }, 404);
      const qty = Number(body.qty_certified);
      if (!(qty >= 0)) return json({ detail: 'qty_certified must be >= 0' }, 422);
      if (qty > row.cap + 1e-6) {
        if (!body.reason_code) return json({ error: 'ABOVE_CAP', cap: row.cap, status: row.status }, 409);
        if (!(body.comment || '').trim()) return json({ detail: 'comment required for an override above cap' }, 422);
      }
      certOverride[row.key] = qty;
      addAudit(role, 'certification', row.key, body.reason_code ? 'CERTIFY_OVERRIDE' : 'CERTIFY', `${row.section_id} ${row.activity_code}: ${row.certified} -> ${qty} ${row.unit} (cap ${row.cap})${body.reason_code ? ' reason ' + body.reason_code : ''}`);
      return json({ ...row, certified: qty });
    }
    let m = p.match(/^\/api\/alerts\/([^/]+)\/status$/);
    if (m) {
      if (['SC', 'AUD', 'FM'].includes(role)) return json({ detail: 'role not allowed to change alert status' }, 403);
      const a = S.alerts.find((x) => x.alert_id === m[1]);
      if (!a) return json({ detail: 'unknown alert' }, 404);
      alertState[a.alert_id] = { status: body.status, comment: body.comment };
      addAudit(role, 'alert', a.alert_id, `STATUS_${body.status}`, `${a.rule_id} -> ${body.status}: ${body.comment || ''}`);
      return json({ ...a, ...alertState[a.alert_id] });
    }
    if (p === '/api/field-reports') {
      if (!body.lines || !body.lines.length) return json({ detail: 'at least one line required' }, 422);
      if (body.lines.some((l) => !(Number(l.kp_to_m) > Number(l.kp_from_m)))) return json({ detail: 'kp_to_m must be greater than kp_from_m' }, 422);
      const dup = reports.find((r) => r.client_uuid === body.client_uuid);
      if (dup) return json({ report_id: dup.report_id, status: 'RECEIVED', duplicate: true }, 200);
      const rid = 'FR-DEMO-' + (reports.length + 1);
      reports.push({ ...body, report_id: rid });
      addAudit(role, 'field_report', rid, 'CREATE', `${body.crew_id} ${body.report_date}`);
      return json({ report_id: rid, status: 'RECEIVED', duplicate: false }, 201);
    }
    return json({ detail: 'not available in the stand-alone demo' }, 404);
  };
})();

<script type="module">await window.__SITEOPS_READY__;
// SiteOps Twin MVP: mobile field app (M1 report, M2 offline outbox, M3 photo evidence, M4 crew muster).
// Offline-first: every report is saved on the device before it is synced. The data is SYNTHETIC.
// Built against POST /api/field-reports in prototype/API_CONTRACT.md.

const ROLE = 'FM'; // the field app always acts as a foreman (demo RBAC)
const $ = (s, r = document) => r.querySelector(s);
const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
let meta = null, step = 1, headcount = 0, photos = [];

// ---------- storage: IndexedDB with localStorage fallback ----------
const store = (() => {
  const LS_KEY = 'siteops.outbox';
  let dbp = null;
  function openDb() {
    if (dbp) return dbp;
    dbp = new Promise((resolve, reject) => {
      try {
        const req = indexedDB.open('siteops-field', 1);
        req.onupgradeneeded = () => req.result.createObjectStore('outbox', { keyPath: 'client_uuid' });
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      } catch (e) { reject(e); }
    });
    return dbp;
  }
  function lsAll() { try { return JSON.parse(localStorage.getItem(LS_KEY) || '[]'); } catch { return []; } }
  function lsSave(list) { try { localStorage.setItem(LS_KEY, JSON.stringify(list)); } catch { /* storage full or blocked */ } }
  return {
    async all() {
      try {
        const db = await openDb();
        return await new Promise((res, rej) => { const r = db.transaction('outbox').objectStore('outbox').getAll(); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
      } catch { return lsAll(); }
    },
    async put(item) {
      try {
        const db = await openDb();
        await new Promise((res, rej) => { const tx = db.transaction('outbox', 'readwrite'); tx.objectStore('outbox').put(item); tx.oncomplete = res; tx.onerror = () => rej(tx.error); });
      } catch {
        const list = lsAll().filter((x) => x.client_uuid !== item.client_uuid); list.push(item); lsSave(list);
      }
    },
  };
})();
function prefGet(k) { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } }
function prefSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch { /* ignore */ } }
function uuid() {
  if (crypto.randomUUID) return crypto.randomUUID();
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, (c) => { const r = (Math.random() * 16) | 0; return (c === 'x' ? r : (r & 0x3) | 0x8).toString(16); });
}

// ---------- metadata (network first; cached copy when offline) ----------
async function loadMeta() {
  try {
    const r = await fetch('/api/meta', { headers: { 'X-Role': ROLE } });
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    meta = await r.json();
    prefSet('siteops.meta', meta);
  } catch {
    meta = prefGet('siteops.meta');
  }
  if (!meta) {
    $('#formErr').textContent = 'No project data on this device yet. Connect once to download the crew and activity lists.';
    meta = { crews: [], fronts: [], activities: [], date_max: new Date().toISOString().slice(0, 10) };
  }
}

function fillSelect(sel, list, val, label, selected) {
  sel.innerHTML = list.map((x) => `<option value="${esc(x[val])}"${x[val] === selected ? ' selected' : ''}>${esc(label(x))}</option>`).join('');
}

// ---------- M1 form ----------
function addLine(data = {}) {
  const node = $('#lineTpl').content.firstElementChild.cloneNode(true);
  const act = node.querySelector('.lAct');
  const crew = (meta.crews || []).find((c) => c.crew_id === $('#rCrew').value);
  fillSelect(act, meta.activities || [], 'activity_code', (a) => `${a.activity_code} · ${a.name}`, data.activity_code || (crew && crew.activity_code));
  const setUnit = () => { const a = (meta.activities || []).find((x) => x.activity_code === act.value); node.querySelector('.lUnit').value = a ? a.unit : ''; };
  act.addEventListener('change', setUnit); setUnit();
  // Equipment: /api/meta has no equipment list in contract v1, so meta.equipment is used when the backend provides it.
  const eqSel = node.querySelector('.lEq');
  const eq = meta.equipment || [];
  if (eq.length) {
    eqSel.innerHTML = eq.map((e) => `<option value="${esc(e.equipment_id)}"${(data.equipment_ids || []).includes(e.equipment_id) ? ' selected' : ''}>${esc(e.equipment_id)}${e.type ? ' · ' + esc(e.type) : ''}</option>`).join('');
  } else {
    const inp = document.createElement('input');
    inp.type = 'text'; inp.className = 'lEq'; inp.placeholder = 'Equipment IDs, comma separated';
    inp.value = (data.equipment_ids || []).join(', ');
    eqSel.replaceWith(inp);
  }
  const front = (meta.fronts || []).find((f) => f.front_id === $('#rFront').value);
  node.querySelector('.lFrom').value = data.kp_from_m ?? (front ? front.kp_from_m : '');
  node.querySelector('.lTo').value = data.kp_to_m ?? '';
  node.querySelector('.lQty').value = data.qty ?? '';
  node.querySelector('.lHours').value = data.hours_worked ?? 10;
  node.querySelector('.lHead').value = data.headcount ?? (headcount || '');
  node.querySelector('.lDown').value = data.downtime_h ?? 0;
  node.querySelector('.lReason').value = data.downtime_reason || '';
  node.querySelector('.lRemove').addEventListener('click', () => { if ($('#lines').children.length > 1) node.remove(); });
  // Suggest the quantity from the KP range for linear (m) activities.
  const autoQty = () => {
    const f = parseFloat(node.querySelector('.lFrom').value), t = parseFloat(node.querySelector('.lTo').value);
    if (node.querySelector('.lUnit').value === 'm' && !isNaN(f) && !isNaN(t) && t > f && !node.querySelector('.lQty').value) node.querySelector('.lQty').value = t - f;
  };
  node.querySelector('.lTo').addEventListener('change', autoQty);
  $('#lines').appendChild(node);
}

function readLines() {
  return [...document.querySelectorAll('#lines .line')].map((n) => {
    const eqEl = n.querySelector('.lEq');
    const equipment_ids = eqEl.tagName === 'SELECT'
      ? [...eqEl.selectedOptions].map((o) => o.value)
      : eqEl.value.split(',').map((s) => s.trim()).filter(Boolean);
    const num = (c) => { const v = parseFloat(n.querySelector(c).value); return isNaN(v) ? null : v; };
    return {
      activity_code: n.querySelector('.lAct').value,
      kp_from_m: num('.lFrom'), kp_to_m: num('.lTo'), qty: num('.lQty'), unit: n.querySelector('.lUnit').value,
      hours_worked: num('.lHours'), headcount: num('.lHead') ?? headcount, equipment_ids,
      downtime_h: num('.lDown') ?? 0, downtime_reason: n.querySelector('.lReason').value || null,
    };
  });
}

function validate(s) {
  const errs = [];
  if (s >= 1) {
    if (!$('#rDate').value) errs.push('Select the report date.');
    if (!$('#rCrew').value) errs.push('Select the crew.');
    if (!$('#rFront').value) errs.push('Select the work front.');
  }
  if (s >= 2) {
    readLines().forEach((l, i) => {
      const n = `Line ${i + 1}: `;
      if (l.kp_from_m == null || l.kp_to_m == null) errs.push(n + 'enter KP from and KP to.');
      else if (l.kp_to_m <= l.kp_from_m) errs.push(n + 'KP to must be greater than KP from.');
      if (l.qty == null || l.qty < 0) errs.push(n + 'enter the quantity.');
      if (l.hours_worked == null || l.hours_worked < 0 || l.hours_worked > 24) errs.push(n + 'hours must be between 0 and 24.');
      if (l.downtime_h > 0 && !l.downtime_reason) errs.push(n + 'select a downtime reason.');
    });
  }
  return errs;
}

function showStep(s) {
  step = s;
  document.querySelectorAll('.step').forEach((el) => { el.hidden = Number(el.dataset.step) !== s; });
  document.querySelectorAll('.steps span').forEach((el) => el.classList.toggle('on', Number(el.dataset.s) === s));
  $('#prevBtn').disabled = s === 1;
  $('#nextBtn').textContent = s === 3 ? 'Save report' : 'Next';
  $('#formErr').textContent = '';
  if (s === 3) renderSummary();
  window.scrollTo(0, 0);
}

function renderSummary() {
  const lines = readLines();
  $('#summary').innerHTML = `<strong>${esc($('#rCrew').value)} · ${esc($('#rFront').value)} · ${esc($('#rDate').value)}</strong><br>
    Headcount ${headcount}<br>${lines.map((l) => `${esc(l.activity_code)} ${l.kp_from_m}–${l.kp_to_m} m: ${l.qty} ${esc(l.unit)}, ${l.hours_worked} h`).join('<br>')}`;
}

function setHeadcount(v) {
  headcount = Math.max(0, v);
  $('#hcOut').textContent = headcount;
  document.querySelectorAll('#lines .lHead').forEach((el) => { if (!el.dataset.touched) el.value = headcount; });
}

async function saveReport() {
  const report = {
    client_uuid: uuid(),
    report_date: $('#rDate').value,
    crew_id: $('#rCrew').value,
    front_id: $('#rFront').value,
    lines: readLines(),
    photos: photos.map(({ name, taken_at, kp_m }) => ({ name, taken_at, kp_m })),
    submitted_at: new Date().toISOString(),
  };
  const item = { ...report, _state: 'pending', _thumbs: photos.map((p) => p.thumb).filter(Boolean), _msg: '', _saved_at: Date.now() };
  await store.put(item);
  // Remember this report for "copy yesterday".
  prefSet('siteops.lastReport', { crew_id: report.crew_id, front_id: report.front_id, lines: report.lines, headcount });
  photos = []; renderPhotos();
  $('#lines').innerHTML = ''; addLine();
  showStep(1);
  await renderQueue();
  setPage('pageQueue');
  syncAll();
}

// ---------- M3 photos ----------
function renderPhotos() {
  $('#photoList').innerHTML = photos.map((p, i) => `<div class="qitem">${p.thumb ? `<img src="${p.thumb}" alt="Photo ${i + 1} thumbnail">` : ''}
    <div>${esc(p.name)} · ${esc(p.taken_at)} · KP ${p.kp_m ?? '–'} m</div>
    <button type="button" data-i="${i}" class="pRemove">Remove</button></div>`).join('');
  document.querySelectorAll('.pRemove').forEach((b) => b.addEventListener('click', () => { photos.splice(Number(b.dataset.i), 1); renderPhotos(); }));
}
function thumbnail(file) {
  return new Promise((resolve) => {
    try {
      const img = new Image();
      const url = URL.createObjectURL(file);
      img.onload = () => {
        const s = 96 / Math.max(img.width, img.height);
        const c = document.createElement('canvas'); c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url);
        resolve(c.toDataURL('image/jpeg', 0.6));
      };
      img.onerror = () => { URL.revokeObjectURL(url); resolve(null); };
      img.src = url;
    } catch { resolve(null); }
  });
}

// ---------- M2 outbox + sync ----------
const STATE_LABEL = { pending: '⏳ Pending', synced: '✔ Synced', duplicate: '≈ Already received', error: '✕ Error' };
async function renderQueue() {
  const items = (await store.all()).sort((a, b) => (b._saved_at || 0) - (a._saved_at || 0));
  const pending = items.filter((i) => i._state === 'pending' || i._state === 'error').length;
  $('#qCount').textContent = pending ? `(${pending})` : '';
  $('#queue').innerHTML = items.length ? items.map((i) => `<div class="qitem">
      <div class="qstate ${esc(i._state)}">${STATE_LABEL[i._state] || esc(i._state)}</div>
      <div><strong>${esc(i.report_date)} · ${esc(i.crew_id)} · ${esc(i.front_id)}</strong></div>
      <div class="muted">${(i.lines || []).map((l) => `${esc(l.activity_code)} ${l.kp_from_m}–${l.kp_to_m}: ${l.qty} ${esc(l.unit)}`).join('; ')}</div>
      ${(i._thumbs || []).map((t, n) => `<img src="${t}" alt="Photo ${n + 1} thumbnail">`).join('')}
      ${i._msg ? `<div class="${i._state === 'error' ? 'err' : 'muted'}">${esc(i._msg)}</div>` : ''}
      ${i.report_id ? `<div class="muted">Server ID ${esc(i.report_id)}</div>` : ''}
    </div>`).join('') : '<p class="muted">No reports saved on this device.</p>';
}

let syncing = false;
async function syncAll() {
  if (syncing) return;
  syncing = true;
  const msg = $('#syncMsg');
  try {
    if (!navigator.onLine) { msg.textContent = 'Offline: reports stay on this device and sync automatically when you are back online.'; return; }
    const items = (await store.all()).filter((i) => i._state === 'pending' || i._state === 'error');
    if (!items.length) { msg.textContent = 'Everything is synced.'; return; }
    msg.textContent = `Syncing ${items.length} report(s)…`;
    let ok = 0;
    for (const it of items) {
      const { _state, _thumbs, _msg, _saved_at, report_id, ...body } = it;
      try {
        const r = await fetch('/api/field-reports', { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Role': ROLE }, body: JSON.stringify(body) });
        let data = null; try { data = await r.json(); } catch { /* no body */ }
        if (r.status === 201 || r.status === 200) {
          it._state = data && data.duplicate ? 'duplicate' : 'synced';
          it.report_id = data && data.report_id; it._msg = ''; ok++;
        } else if (r.status === 422 || r.status === 400 || r.status === 403) {
          it._state = 'error';
          it._msg = `Rejected by server (${r.status}): ${data ? JSON.stringify(data.detail || data.error || data) : ''}`;
        } else {
          it._state = 'pending'; it._msg = `Server error ${r.status}; will retry.`;
        }
      } catch {
        it._state = 'pending'; it._msg = 'Network error; will retry.';
      }
      await store.put(it);
    }
    msg.textContent = `${ok} of ${items.length} synced.`;
  } finally {
    syncing = false;
    await renderQueue();
  }
}

// ---------- navigation + network status ----------
function setPage(id) {
  ['pageReport', 'pageQueue'].forEach((p) => { $('#' + p).hidden = p !== id; });
  document.querySelectorAll('.bottomnav button[data-page]').forEach((b) => {
    if (b.dataset.page === id) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
  });
  if (id === 'pageQueue') renderQueue();
}
function netStatus() {
  const el = $('#net');
  el.className = 'net ' + (navigator.onLine ? 'online' : 'offline');
  el.textContent = navigator.onLine ? '● Online' : '○ Offline';
}

// ---------- init ----------
async function init() {
  netStatus();
  window.addEventListener('online', () => { netStatus(); syncAll(); });
  window.addEventListener('offline', netStatus);
  if ('serviceWorker' in navigator) Promise.reject().catch(() => { /* SW not available */ });

  await loadMeta();
  $('#rDate').value = meta.default_date || meta.date_max || new Date().toISOString().slice(0, 10);
  if (meta.date_min) $('#rDate').min = meta.date_min;
  const last = prefGet('siteops.lastReport');
  fillSelect($('#rCrew'), meta.crews || [], 'crew_id', (c) => `${c.crew_id} · ${c.activity_code} · ${c.subcontractor_id}`, last && last.crew_id);
  fillSelect($('#rFront'), meta.fronts || [], 'front_id', (f) => `${f.front_id} · ${f.type} · ${f.kp_from_m}–${f.kp_to_m} m`, last && last.front_id);
  const crew = (meta.crews || []).find((c) => c.crew_id === $('#rCrew').value);
  setHeadcount(crew ? crew.nominal_size || 0 : 0);
  addLine();

  $('#rCrew').addEventListener('change', () => { const c = (meta.crews || []).find((x) => x.crew_id === $('#rCrew').value); if (c) setHeadcount(c.nominal_size || 0); });
  $('#hcMinus').addEventListener('click', () => setHeadcount(headcount - 1));
  $('#hcPlus').addEventListener('click', () => setHeadcount(headcount + 1));
  $('#lines').addEventListener('input', (e) => { if (e.target.classList.contains('lHead')) e.target.dataset.touched = '1'; });
  $('#copyYesterday').addEventListener('click', () => {
    const l = prefGet('siteops.lastReport');
    if (!l) { $('#formErr').textContent = 'No previous report saved on this device.'; return; }
    $('#rCrew').value = l.crew_id; $('#rFront').value = l.front_id;
    setHeadcount(l.headcount || 0);
    $('#lines').innerHTML = '';
    // Carry over the activity, equipment and hours; start the KP where yesterday ended. Quantity is left blank.
    (l.lines || []).forEach((x) => addLine({ ...x, kp_from_m: x.kp_to_m, kp_to_m: null, qty: null }));
    if (!$('#lines').children.length) addLine();
    $('#formErr').textContent = '';
  });
  $('#addLine').addEventListener('click', () => addLine());
  $('#prevBtn').addEventListener('click', () => showStep(Math.max(1, step - 1)));
  $('#nextBtn').addEventListener('click', async () => {
    const errs = validate(step);
    if (errs.length) { $('#formErr').innerHTML = errs.map(esc).join('<br>'); return; }
    if (step < 3) showStep(step + 1); else await saveReport();
  });
  $('#photoIn').addEventListener('change', async (e) => {
    for (const f of e.target.files) {
      const kpv = parseFloat($('#photoKp').value);
      photos.push({ name: f.name, taken_at: new Date(f.lastModified || Date.now()).toISOString(), kp_m: isNaN(kpv) ? null : kpv, thumb: await thumbnail(f) });
    }
    e.target.value = '';
    renderPhotos();
  });
  $('#syncBtn').addEventListener('click', syncAll);
  document.querySelectorAll('.bottomnav button[data-page]').forEach((b) => b.addEventListener('click', () => setPage(b.dataset.page)));
  showStep(1);
  renderQueue();
  syncAll();
}

init();

</script>
</body>
</html>
